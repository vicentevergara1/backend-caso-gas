spring.application.name=gas-el-volcan-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gas_el_volcan?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt-secret-base64=${JWT_SECRET_BASE64:}
app.cors-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:false}
app.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.seller-email=${SELLER_EMAIL:}
app.seller-password=${SELLER_PASSWORD:}
springdoc.swagger-ui.path=/swagger-ui.html
